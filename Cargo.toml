[package]
name = "rawtoh-module-sdk"
version = "0.1.0"
edition = "2024"
description = "Client SDK for external Rawtoh modules: hub connection, Ed25519 enrollment"
repository = "https://github.com/rawtoh-io/module-sdk-rust"
license = "UNLICENSED"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "macros"] }
